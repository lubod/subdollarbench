name: SubDollarBench CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test:
    name: Build & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain (bench pin)
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cache cargo registry & index
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check code formatting (cargo fmt)
        run: cargo fmt --check

      - name: Run clippy linter
        run: cargo clippy --all-targets -- -D warnings

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Build sandbox image
        run: >-
          docker build -t subdollar-sandbox
          --build-arg SANDBOX_UID=$(id -u)
          --build-arg SANDBOX_GID=$(id -g)
          -f Dockerfile.sandbox .

      - name: Test and coverage (fast set, one run)
        run: |
          skips=()
          while read -r name; do
            skips+=(--skip "$name")
          done < <(scripts/live-proofs.sh)
          # Coverage measures active code only: the retired single-shot
          # verifiers remain compiled but are not dispatched by sdb-sql.
          # Active-code lines measured 83.56% on this CI set; round 29's
          # measured-round-down rule gives the 83 ratchet, which only goes up.
          cargo llvm-cov --all-targets --summary-only \
            --ignore-filename-regex 'src/verifier/(redis|http|proxy|pdf|wal|queue|binproto|pubsub)\.rs$' \
            --fail-under-lines 83 -- "${skips[@]}"
