name: SubDollarBench CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test:
    name: Build & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain (bench pin)
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cache cargo registry & index
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check code formatting (cargo fmt)
        run: cargo fmt --check

      - name: Run clippy linter
        run: cargo clippy --all-targets -- -D warnings

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Build sandbox image
        run: >-
          docker build -t subdollar-sandbox
          --build-arg SANDBOX_UID=$(id -u)
          --build-arg SANDBOX_GID=$(id -g)
          -f Dockerfile.sandbox .

      - name: Test and coverage (fast set, one run)
        run: |
          skips=()
          while read -r name; do
            skips+=(--skip "$name")
          done < <(scripts/live-proofs.sh)
          # Coverage measures the product code, not the test code. R68 F4:
          # the 19 live proofs CI skips live in tests.rs files since round
          # 61, and their never-run bodies counted as missed lines (82.48%
          # at 2798819, 83.23% at 0507473). The tests.rs files are test-only;
          # excluding them restores the product measurement. Lines measured
          # 84.36% on this CI set before that split; round 29's
          # measured-round-down rule gives the 84 ratchet, which only goes up.
          cargo llvm-cov --all-targets --summary-only \
            --ignore-filename-regex '(^|/)tests\.rs$' \
            --fail-under-lines 84 -- "${skips[@]}"
