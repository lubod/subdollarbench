[package]
name = "subdollarbench"
version = "0.2.0"
edition = "2021"
description = "Autonomous under-$1 system-building benchmark for budget LLMs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lubod/subdollarbench"

[dependencies]
sha2 = "0.10"
tokio = { version = "1.38", features = ["full"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
comfy-table = "7.1"
colored = "2.1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
axum = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }
flate2 = "1.1.10"
crc32fast = "1.5"
rand = "0.10.2"
rusqlite = { version = "0.32", features = ["bundled"] }
parking_lot = "0.12"
libc = "0.2"

[build-dependencies]
sha2 = "0.10"
